
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <title>BLACK LINE | دخول المسوّقين</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #090909;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 38px 28px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 18px;
      box-shadow: 0 20px 60px #0008;
    }

    .brand {
      text-align: center;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .brand span {
      color: #aaa;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 32px;
      font-size: 14px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      color: #ccc;
      font-size: 14px;
      margin: 17px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #0b0b0b;
      color: white;
      border: 1px solid #333;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #aaa;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: 0;
      border-radius: 9px;
      background: #fff;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      min-height: 22px;
      margin-top: 17px;
      text-align: center;
      font-size: 14px;
      color: #ff7777;
    }

    .back {
      display: block;
      text-align: center;
      color: #999;
      text-decoration: none;
      margin-top: 22px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="brand">
      <span>BLACK</span> LINE WEAR
    </div>

    <p class="subtitle">AFFILIATE PARTNER PORTAL</p>

    <h1>تسجيل دخول المسوّقين</h1>

    <form id="loginForm">

      <label for="username">اسم المستخدم</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        required
      >

      <label for="password">كلمة المرور</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        تسجيل الدخول
      </button>

      <p id="message" role="alert"></p>

    </form>

    <a class="back" href="/">العودة إلى المتجر</a>

  </main>

  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    // لو المسوّق مسجل دخوله بالفعل
    async function checkSession() {
      try {
        const response = await fetch("/api/affiliate", {
          credentials: "same-origin",
          cache: "no-store"
        });

        if (response.ok) {
          const result = await response.json();

          if (result.success) {
            window.location.replace("/affiliate/dashboard.html");
          }
        }
      } catch (error) {
        console.error(error);
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "جارٍ تسجيل الدخول...";
      message.textContent = "";

      try {
        const response = await fetch("/api/affiliate", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: form.username.value.trim(),
            password: form.password.value
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.error || "فشل تسجيل الدخول");
        }

        window.location.replace("/affiliate/dashboard.html");

      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "تسجيل الدخول";
      }
    });

    checkSession();
  </script>

</body>
</html>
