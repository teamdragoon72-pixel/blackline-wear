
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الموظف | BLACK LINE</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0;
      background: #090909;
      color: white;
      min-height: 100vh;
    }
    header {
      background: #151515;
      border-bottom: 1px solid #333;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; }
    main { max-width: 1100px; margin: 25px auto; padding: 15px; }
    .welcome, .panel, .order-card {
      background: #171717;
      border: 1px solid #303030;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
    }
    h1 { font-size: 24px; margin-top: 0; }
    h2 { font-size: 20px; }
    h3 { font-size: 18px; }
    .muted { color: #aaa; line-height: 1.8; }
    .name { color: white; font-weight: bold; }
    button {
      background: white;
      color: black;
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .secondary { background: #333; color: white; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      background: #202020;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .stat strong { display: block; font-size: 25px; margin-top: 8px; }
    .details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 18px 0;
    }
    .detail {
      background: #222;
      padding: 12px;
      border-radius: 9px;
      color: #ddd;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }
    .detail b { color: #aaa; display: block; font-size: 13px; }
    .status {
      display: inline-block;
      background: #292929;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
    }
    .followup {
      border-top: 1px solid #383838;
      margin-top: 20px;
      padding-top: 15px;
    }
    label {
      display: block;
      margin: 12px 0 7px;
      color: #ddd;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #101010;
      color: white;
      outline: none;
      font-size: 15px;
    }
    textarea { min-height: 85px; resize: vertical; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .history-item {
      background: #222;
      border-right: 3px solid #777;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      line-height: 1.8;
    }
    .message { margin-top: 12px; color: #aaa; font-size: 14px; }
    .success { color: #71dc91; }
    .error { color: #ff7777; }
    .empty { text-align: center; padding: 30px; color: #aaa; }
    .phone-link { color: #9fd6ff; text-decoration: none; }
    @media (max-width: 600px) {
      header { padding: 15px; }
      main { margin-top: 15px; }
      .welcome, .panel, .order-card { padding: 16px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">BLACK LINE</div>
  <div>EMPLOYEE DASHBOARD</div>
</header>

<main>
  <section class="welcome">
    <h1>أهلاً بيك في BLACK LINE</h1>
    <p class="muted">
      مرحباً <span class="name" id="employeeName">...</span>
    </p>
    <p class="muted">دي لوحة متابعة الطلبات الخاصة بيك.</p>
    <button class="secondary" onclick="loadOrders()">تحديث الطلبات</button>
    <div id="status" class="message">جاري التحقق من جلسة الدخول...</div>
  </section>

  <section class="stats">
    <div class="stat">إجمالي الطلبات<strong id="totalOrders">0</strong></div>
    <div class="stat">طلبات جديدة<strong id="pendingOrders">0</strong></div>
    <div class="stat">تم تسجيل متابعتها<strong id="followedOrders">0</strong></div>
  </section>

  <section class="panel">
    <h2>الطلبات المسندة إليك</h2>
    <div id="ordersContainer" class="muted">جاري تحميل الطلبات...</div>
  </section>
</main>

<script>
const statusNames = {
  pending: "طلب جديد",
  processing: "قيد التجهيز",
  shipped: "تم الشحن",
  delivered: "تم التسليم",
  cancelled: "ملغي",
  new: "طلب جديد"
};

const outcomeNames = {
  answered: "تم الرد",
  no_answer: "لم يرد",
  busy: "الخط مشغول",
  wrong_number: "رقم خاطئ",
  confirmed: "تم تأكيد الطلب",
  cancelled: "العميل ألغى الطلب",
  needs_followup: "يحتاج متابعة"
};

const methodNames = {
  call: "مكالمة هاتفية",
  whatsapp: "واتساب",
  other: "وسيلة أخرى"
};

let currentEmployee = null;
let orders = [];

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function formatMoney(value) {
  return Number(value || 0).toLocaleString("en-US") + " جنيه";
}

function formatDate(value) {
  if (!value) return "غير محدد";
  return escapeHTML(String(value).replace("T", " "));
}

function setStatus(message, type = "") {
  const element = document.getElementById("status");
  element.textContent = message;
  element.className = "message " + type;
}

async function checkEmployeeSession() {
  try {
    const response = await fetch("/api/employee", {
      method: "GET",
      credentials: "same-origin"
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      window.location.replace("/employee/");
      return;
    }

    currentEmployee = data.employee;

    document.getElementById("employeeName").textContent =
      currentEmployee.full_name ||
      currentEmployee.name ||
      currentEmployee.username;

    setStatus("حسابك نشط وجلسة الدخول صالحة.", "success");

    await loadOrders();

  } catch (error) {
    setStatus("تعذر الاتصال بالسيرفر. حدّث الصفحة وحاول مرة أخرى.", "error");
  }
}

async function loadOrders() {
  const container = document.getElementById("ordersContainer");
  container.textContent = "جاري تحميل الطلبات...";

  try {
    const response = await fetch("/api/employee/orders", {
      credentials: "same-origin"
    });

    const data = await response.json();

    if (response.status === 401 || response.status === 403) {
      window.location.replace("/employee/");
      return;
    }

    if (!response.ok || !data.success) {
      throw new Error(data.error || "تعذر تحميل الطلبات");
    }

    orders = Array.isArray(data.orders) ? data.orders : [];

    document.getElementById("totalOrders").textContent = orders.length;
    document.getElementById("pendingOrders").textContent =
      orders.filter(order => ["pending", "new"].includes(order.status)).length;
    document.getElementById("followedOrders").textContent =
      orders.filter(order => order.latest_followup_outcome).length;

    if (!orders.length) {
      container.innerHTML = '<div class="empty">مفيش طلبات مسندة ليك حالياً.</div>';
      return;
    }

    container.innerHTML = orders.map(renderOrder).join("");

    setStatus("تم تحميل الطلبات بنجاح.", "success");

    orders.forEach(order => loadFollowups(order.id));

  } catch (error) {
    container.textContent = error.message || "حدث خطأ أثناء تحميل الطلبات.";
    setStatus("تعذر تحميل الطلبات.", "error");
  }
}

function renderOrder(order) {
  const id = Number(order.id);
  const phone = String(order.phone || "");
  const safePhone = phone.replace(/[^\d+]/g, "");

  return `
    <article class="order-card" id="order-${id}">
      <h3>طلب رقم #${id}</h3>
      <span class="status">${escapeHTML(statusNames[order.status] || order.status || "غير محدد")}</span>

      <div class="details">
        <div class="detail"><b>اسم العميل</b>${escapeHTML(order.customer_name)}</div>
        <div class="detail"><b>رقم الهاتف</b>
          <a class="phone-link" href="tel:${escapeHTML(safePhone)}">${escapeHTML(phone)}</a>
        </div>
        <div class="detail"><b>العنوان</b>${escapeHTML(order.address)}</div>
        <div class="detail"><b>المنتج</b>${escapeHTML(order.product_name)}</div>
        <div class="detail"><b>المقاس</b>${escapeHTML(order.size)}</div>
        <div class="detail"><b>اللون</b>${escapeHTML(order.color)}</div>
        <div class="detail"><b>الكمية</b>${escapeHTML(order.quantity)}</div>
        <div class="detail"><b>سعر القطعة</b>${formatMoney(order.price)}</div>
        <div class="detail"><b>الإجمالي</b>${formatMoney(order.total)}</div>
        <div class="detail"><b>تاريخ الطلب</b>${formatDate(order.created_at)}</div>
        <div class="detail"><b>آخر نتيجة متابعة</b>
          ${escapeHTML(outcomeNames[order.latest_followup_outcome] || "لم تتم المتابعة بعد")}
        </div>
        <div class="detail"><b>موعد المتابعة القادم</b>${formatDate(order.next_followup_at)}</div>
      </div>

      <section class="followup">
        <h3>تسجيل متابعة للطلب #${id}</h3>

        <form onsubmit="saveFollowup(event, ${id})">
          <div class="form-grid">
            <div>
              <label>طريقة التواصل</label>
              <select name="contact_method" required>
                <option value="call">مكالمة هاتفية</option>
                <option value="whatsapp">واتساب</option>
                <option value="other">وسيلة أخرى</option>
              </select>
            </div>

            <div>
              <label>نتيجة التواصل</label>
              <select name="outcome" required>
                <option value="answered">تم الرد</option>
                <option value="no_answer">لم يرد</option>
                <option value="busy">الخط مشغول</option>
                <option value="wrong_number">رقم خاطئ</option>
                <option value="confirmed">تم تأكيد الطلب</option>
                <option value="cancelled">العميل ألغى الطلب</option>
                <option value="needs_followup">يحتاج متابعة</option>
              </select>
            </div>
          </div>

          <label>ملاحظات الموظف</label>
          <textarea name="notes" maxlength="2000" placeholder="اكتب تفاصيل المكالمة أو كلام العميل..."></textarea>

          <label>موعد المتابعة القادم (اختياري)</label>
          <input type="datetime-local" name="next_followup_at">

          <button type="submit" style="margin-top:15px;">حفظ المتابعة</button>
          <div class="message" id="save-message-${id}"></div>
        </form>

        <div>
          <h3>سجل المتابعات السابقة</h3>
          <div id="history-${id}" class="muted">جاري تحميل السجل...</div>
        </div>
      </section>
    </article>
  `;
}

async function loadFollowups(orderId) {
  const container = document.getElementById("history-" + orderId);
  if (!container) return;

  try {
    const response = await fetch(
      "/api/employee/followups?order_id=" + encodeURIComponent(orderId),
      { credentials: "same-origin" }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "تعذر تحميل سجل المتابعة");
    }

    const followups = Array.isArray(data.followups) ? data.followups : [];

    if (!followups.length) {
      container.innerHTML = '<p class="muted">لا توجد متابعات مسجلة لهذا الطلب حتى الآن.</p>';
      return;
    }

    container.innerHTML = followups.map(item => `
      <div class="history-item">
        <b>طريقة التواصل:</b>
        ${escapeHTML(methodNames[item.contact_method] || item.contact_method)}
        <br>
        <b>النتيجة:</b>
        ${escapeHTML(outcomeNames[item.outcome] || item.outcome)}
        <br>
        <b>الملاحظات:</b>
        ${escapeHTML(item.notes || "لا توجد ملاحظات")}
        <br>
        <b>موعد المتابعة:</b>
        ${formatDate(item.next_followup_at)}
        <br>
        <b>تاريخ التسجيل:</b>
        ${formatDate(item.created_at)}
      </div>
    `).join("");

  } catch (error) {
    container.textContent = error.message || "حدث خطأ أثناء تحميل السجل.";
  }
}

async function saveFollowup(event, orderId) {
  event.preventDefault();

  const form = event.target;
  const button = form.querySelector('button[type="submit"]');
  const message = document.getElementById("save-message-" + orderId);

  const formData = new FormData(form);

  const payload = {
    order_id: orderId,
    contact_method: formData.get("contact_method"),
    outcome: formData.get("outcome"),
    notes: formData.get("notes") || "",
    next_followup_at: formData.get("next_followup_at") || null
  };

  button.disabled = true;
  message.textContent = "جاري حفظ المتابعة...";
  message.className = "message";

  try {
    const response = await fetch("/api/employee/followups", {
      method: "POST",
      credentials: "same-origin",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const data = await response.json();

    if (response.status === 401 || response.status === 403) {
      window.location.replace("/employee/");
      return;
    }

    if (!response.ok || !data.success) {
      throw new Error(data.error || "فشل حفظ المتابعة");
    }

    message.textContent = "تم حفظ المتابعة بنجاح.";
    message.className = "message success";

    form.reset();

    await loadFollowups(orderId);
    await loadOrders();

  } catch (error) {
    message.textContent = error.message || "حدث خطأ أثناء الحفظ.";
    message.className = "message error";
  } finally {
    button.disabled = false;
  }
}

checkEmployeeSession();
</script>

</body>
</html>
