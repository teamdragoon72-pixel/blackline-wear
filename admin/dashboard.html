
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLACK LINE - لوحة الإدارة</title>
  <style>
    
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin: 20px 0;
}

.stat-card {
  background: #1c1c1c;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 18px;
}

.stat-card span {
  color: #aaa;
  font-size: 14px;
}

.stat-card strong {
  display: block;
  font-size: 25px;
  margin-top: 12px;
  color: #25D366;
}

.top-products {
  background: #1c1c1c;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 18px;
  margin: 20px 0;
}

.top-products h2 {
  margin-top: 0;
}

.top-product {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid #333;
  color: #ddd;
}

.top-product:last-child {
  border-bottom: 0;
}

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      border-bottom: 1px solid #333;
      padding-bottom: 20px;
    }

    h1 { letter-spacing: 2px; }

    button, select {
      border: 0;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    button { margin: 4px; }

    .refresh { background: white; color: black; }
    .logout { background: #333; color: white; }

    .summary {
      background: #1c1c1c;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 12px;
      margin: 25px 0;
    }

    .summary strong {
      font-size: 28px;
      display: block;
      margin-top: 10px;
    }

    #orders {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .order {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 18px;
      overflow-wrap: anywhere;
    }

    .order h3 { margin-top: 0; }

    .order p {
      color: #ccc;
      line-height: 1.8;
      margin: 6px 0;
    }

    .total {
      color: white !important;
      font-size: 20px;
      font-weight: bold;
      border-top: 1px solid #444;
      padding-top: 12px;
    }

    .status { color: #ddd; margin: 10px 0; }

    select {
      width: 100%;
      background: #292929;
      color: white;
      border: 1px solid #555;
      margin-top: 10px;
    }

    .save {
      width: 100%;
      background: white;
      color: black;
      margin: 10px 0;
    }

    .save:disabled {
      opacity: .5;
      cursor: wait;
    }

    .whatsapp {
      display: block;
      width: 100%;
      background: #25D366;
      color: #071b0e;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      padding: 13px;
      margin-top: 12px;
      font-weight: bold;
    }

    .whatsapp:hover { background: #20bd5b; }

    #message { color: #bbb; margin: 20px 0; }

    @media(max-width:500px) {
      body { padding: 12px; }
      header { align-items: stretch; }
    }
  
/* إدارة الموظفين */
.employees-section {
  background: #1c1c1c;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 20px;
  margin: 20px 0;
}

.employees-section h2 {
  margin-top: 0;
}

.employee-form {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}

.employee-form input {
  width: 100%;
  min-width: 0;
  padding: 12px;
  background: #292929;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
  font-size: 15px;
}

.employee-form button {
  background: white;
  color: black;
}

.employee-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 14px 0;
  border-top: 1px solid #333;
}

.employee-item p {
  margin: 5px 0;
  color: #ccc;
}

.employee-item button {
  background: #25D366;
  color: #071b0e;
}

.employee-item button.inactive {
  background: #ff7777;
  color: #200;
}

#employeeMessage {
  color: #bbb;
  min-height: 24px;
}

  </style>
</head>
<body>

  <header>
    <div>
      <h1>BLACK LINE</h1>
      <p>ADMIN DASHBOARD</p>
    </div>

    <div>
      <button class="refresh" id="refresh">تحديث الطلبات</button>
      <button class="logout" id="logout">خروج</button>
    </div>
  </header>

 
<section class="summary">
  إجمالي الطلبات المعروضة
  <strong id="count">0</strong>
</section>

<section class="stats-grid">
  <div class="stat-card">
    <span>إجمالي المبيعات</span>
    <strong id="totalSales">0 جنيه</strong>
  </div>

  <div class="stat-card">
    <span>الطلبات الجديدة</span>
    <strong id="pendingOrders">0</strong>
  </div>

  <div class="stat-card">
    <span>قيد التجهيز</span>
    <strong id="processingOrders">0</strong>
  </div>

  <div class="stat-card">
    <span>تم التسليم</span>
    <strong id="deliveredOrders">0</strong>
  </div>
</section>

<section class="top-products">
  <h2>🏆 أكثر المنتجات مبيعاً</h2>
  <div id="topProducts">جاري تحميل المنتجات...</div>
</section>



<section class="employees-section">
  <h2>👥 إدارة الموظفين</h2>

  <form id="employeeForm" class="employee-form">
    <input
      type="text"
      id="employeeName"
      placeholder="اسم الموظف بالكامل"
      required
      maxlength="100"
    >

    <input
      type="text"
      id="employeeUsername"
      placeholder="اسم المستخدم بالإنجليزية"
      required
      maxlength="40"
      autocomplete="username"
    >

    <input
      type="password"
      id="employeePassword"
      placeholder="كلمة المرور (8 أحرف على الأقل)"
      required
      minlength="8"
      maxlength="200"
      autocomplete="new-password"
    >

    <button type="submit" id="createEmployeeButton">إنشاء حساب الموظف</button>
  </form>

  <p id="employeeMessage" aria-live="polite"></p>
  <div id="employeesList">جاري تحميل الموظفين...</div>
</section>

  <p id="message">جاري تحميل الطلبات...</p>
  <section id="orders"></section>

  <script>
    const ordersBox = document.getElementById("orders");
    const message = document.getElementById("message");

    const statusNames = {
      pending: "جديد",
      processing: "قيد التجهيز",
      shipped: "تم الشحن",
      delivered: "تم التسليم",
      cancelled: "ملغي"
    };
    
function renderStats(stats, products) {
  const money = Number(stats.totalSales || 0);

  document.getElementById("totalSales").textContent =
    money.toLocaleString("en-US") + " جنيه";

  document.getElementById("pendingOrders").textContent =
    Number(stats.pendingOrders || 0);

  document.getElementById("processingOrders").textContent =
    Number(stats.processingOrders || 0);

  document.getElementById("deliveredOrders").textContent =
    Number(stats.deliveredOrders || 0);

  const box = document.getElementById("topProducts");
  box.replaceChildren();

  if (!products || products.length === 0) {
    box.textContent = "لا توجد مبيعات حتى الآن.";
    return;
  }

  products.forEach((product, index) => {
    const row = document.createElement("div");
    row.className = "top-product";

    const name = document.createElement("span");
    name.textContent =
      (index + 1) + ". " + product.product_name;

    const quantity = document.createElement("strong");
    quantity.textContent =
      Number(product.totalQuantity || 0) + " قطعة";

    row.appendChild(name);
    row.appendChild(quantity);
    box.appendChild(row);
  });
}


    function addText(parent, tag, value, className = "") {
      const element = document.createElement(tag);
      element.textContent = value ?? "";
      if (className) element.className = className;
      parent.appendChild(element);
      return element;
    }

    // تحويل رقم الهاتف إلى الصيغة الدولية المصرية
    function normalizePhone(phone) {
      let number = String(phone || "").replace(/\D/g, "");

      if (number.startsWith("00")) {
        number = number.slice(2);
      }

      if (number.startsWith("0")) {
        number = "20" + number.slice(1);
      } else if (/^(10|11|12|15)\d{8}$/.test(number)) {
        number = "20" + number;
      }

      return number;
    }

    // تجهيز رسالة واتساب للعميل
    function createWhatsAppLink(order) {
      const phone = normalizePhone(order.phone);

      if (!phone || phone.length < 10) {
        return null;
      }

      const customerName = order.customer_name || "عميلنا العزيز";

      const text =
`أهلاً ${customerName} ❤️

مع حضرتك فريق BLACK LINE WEAR.

بنتواصل مع حضرتك لتأكيد طلبك:

رقم الطلب: #${order.id}
المنتج: ${order.product_name}
المقاس: ${order.size || "غير محدد"}
اللون: ${order.color || "غير محدد"}
الكمية: ${order.quantity}
الإجمالي: ${order.total} جنيه

شكراً لثقتك في BLACK LINE WEAR 🖤`;

      return "https://wa.me/" + phone +
        "?text=" + encodeURIComponent(text);
    }

    async function updateOrder(id, status, button) {
      button.disabled = true;
      button.textContent = "جاري الحفظ...";

      try {
        const response = await fetch("/api/admin/update-order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ id, status })
        });

        if (response.status === 401) {
          window.location.href = "/admin/";
          return;
        }

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "فشل تحديث الحالة");
        }

        message.textContent = "تم تحديث الطلب #" + id + " بنجاح";
        await loadOrders();

      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "حفظ الحالة";
      }
    }

    async function loadOrders() {
      message.textContent = "جاري تحميل الطلبات...";
      ordersBox.replaceChildren();

      try {
        const response = await fetch("/api/admin/orders", {
          credentials: "same-origin",
          cache: "no-store"
        });

        if (response.status === 401) {
          window.location.href = "/admin/";
          return;
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "تعذر تحميل الطلبات");
        }

        renderStats(data.stats || {}, data.topProducts || []);
        
        const orders = data.orders || [];
        document.getElementById("count").textContent = orders.length;

        if (!orders.length) {
          message.textContent = "لا توجد طلبات حتى الآن.";
          return;
        }

        message.textContent = "";

        orders.forEach(order => {
          const card = document.createElement("article");
          card.className = "order";

          addText(card, "h3", "طلب رقم #" + order.id);
          addText(card, "p", "العميل: " + order.customer_name);
          addText(card, "p", "الهاتف: " + order.phone);
          addText(card, "p", "العنوان: " + order.address);
          addText(card, "p", "المنتج: " + order.product_name);
          addText(card, "p", "المقاس: " + (order.size || "غير محدد"));
          addText(card, "p", "اللون: " + (order.color || "غير محدد"));
          addText(card, "p", "الكمية: " + order.quantity);
          addText(card, "p", "سعر القطعة: " + order.price + " جنيه");
          addText(card, "p", "الحالة الحالية: " +
            (statusNames[order.status] || order.status), "status");
          addText(card, "p", "التاريخ: " + order.created_at);
          addText(card, "p", "الإجمالي: " + order.total + " جنيه", "total");

          // زر واتساب
          const whatsappUrl = createWhatsAppLink(order);

          if (whatsappUrl) {
            const whatsappButton = document.createElement("a");
            whatsappButton.className = "whatsapp";
            whatsappButton.href = whatsappUrl;
            whatsappButton.target = "_blank";
            whatsappButton.rel = "noopener noreferrer";
            whatsappButton.textContent = "تواصل مع العميل عبر واتساب";
            card.appendChild(whatsappButton);
          } else {
            addText(card, "p", "رقم الهاتف غير صالح لفتح واتساب");
          }

          const select = document.createElement("select");
          select.setAttribute("aria-label", "حالة الطلب");

          Object.entries(statusNames).forEach(([value, label]) => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = label;
            option.selected = value === order.status;
            select.appendChild(option);
          });

          card.appendChild(select);

          const saveButton = document.createElement("button");
          saveButton.className = "save";
          saveButton.textContent = "حفظ الحالة";

          saveButton.addEventListener("click", () => {
            updateOrder(order.id, select.value, saveButton);
          });

          card.appendChild(saveButton);
          ordersBox.appendChild(card);
        });

      } catch (error) {
        message.textContent = error.message;
      }
    }


    // إدارة الموظفين
    const employeeForm = document.getElementById("employeeForm");
    const employeeMessage = document.getElementById("employeeMessage");
    const employeesList = document.getElementById("employeesList");
    const createEmployeeButton = document.getElementById("createEmployeeButton");

    function showEmployeeMessage(text, isError = false) {
      employeeMessage.textContent = text;
      employeeMessage.style.color = isError ? "#ff7777" : "#bbb";
    }

    async function loadEmployees() {
      employeesList.textContent = "جاري تحميل الموظفين...";

      try {
        const response = await fetch("/api/admin/employees", {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store"
        });

        if (response.status === 401) {
          window.location.href = "/admin/";
          return;
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "تعذر تحميل الموظفين");
        }

        employeesList.replaceChildren();

        const employees = data.employees || [];

        if (!employees.length) {
          employeesList.textContent = "لا يوجد موظفون حتى الآن.";
          return;
        }

        employees.forEach(employee => {
          const item = document.createElement("div");
          item.className = "employee-item";

          const details = document.createElement("div");
          addText(details, "strong", employee.full_name);
          addText(details, "p", "اسم المستخدم: " + employee.username);
          addText(
            details,
            "p",
            "الحالة: " + (Number(employee.is_active) === 1 ? "نشط" : "متوقف")
          );

          const toggleButton = document.createElement("button");
          const isActive = Number(employee.is_active) === 1;
          toggleButton.className = isActive ? "inactive" : "";
          toggleButton.textContent = isActive ? "إيقاف الحساب" : "تفعيل الحساب";
          toggleButton.addEventListener("click", () => {
            updateEmployeeStatus(employee.id, !isActive, toggleButton);
          });

          item.appendChild(details);
          item.appendChild(toggleButton);
          employeesList.appendChild(item);
        });

      } catch (error) {
        employeesList.textContent = error.message || "حدث خطأ أثناء تحميل الموظفين";
      }
    }

    async function updateEmployeeStatus(id, activate, button) {
      button.disabled = true;
      const oldText = button.textContent;
      button.textContent = "جاري التحديث...";

      try {
        const response = await fetch("/api/admin/employees", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            id,
            is_active: activate
          })
        });

        if (response.status === 401) {
          window.location.href = "/admin/";
          return;
        }

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "تعذر تحديث حساب الموظف");
        }

        showEmployeeMessage(result.message || "تم تحديث حساب الموظف بنجاح");
        await loadEmployees();

      } catch (error) {
        showEmployeeMessage(error.message, true);
        button.disabled = false;
        button.textContent = oldText;
      }
    }

    employeeForm.addEventListener("submit", async event => {
      event.preventDefault();

      createEmployeeButton.disabled = true;
      createEmployeeButton.textContent = "جاري إنشاء الحساب...";
      showEmployeeMessage("جاري إنشاء حساب الموظف...");

      const payload = {
        full_name: document.getElementById("employeeName").value.trim(),
        username: document.getElementById("employeeUsername").value.trim(),
        password: document.getElementById("employeePassword").value
      };

      try {
        const response = await fetch("/api/admin/employees", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(payload)
        });

        if (response.status === 401) {
          window.location.href = "/admin/";
          return;
        }

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "فشل إنشاء حساب الموظف");
        }

        employeeForm.reset();
        showEmployeeMessage(result.message || "تم إنشاء حساب الموظف بنجاح");
        await loadEmployees();

      } catch (error) {
        showEmployeeMessage(error.message, true);
      } finally {
        createEmployeeButton.disabled = false;
        createEmployeeButton.textContent = "إنشاء حساب الموظف";
      }
    });


    document.getElementById("refresh").addEventListener("click", loadOrders);

    document.getElementById("logout").addEventListener("click", () => {
      window.location.href = "/api/admin/logout";
    });

    loadOrders();
    loadEmployees();
  </script>

</body>
</html>
