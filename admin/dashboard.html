
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLACK LINE - لوحة الإدارة</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      border-bottom: 1px solid #333;
      padding-bottom: 20px;
    }
    h1 { letter-spacing: 2px; }
    button, select {
      border: 0;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    button { margin: 4px; }
    .refresh { background: white; color: black; }
    .logout { background: #333; color: white; }
    .summary {
      background: #1c1c1c;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 12px;
      margin: 25px 0;
    }
    .summary strong {
      font-size: 28px;
      display: block;
      margin-top: 10px;
    }
    #orders {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .order {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 18px;
      overflow-wrap: anywhere;
    }
    .order h3 { margin-top: 0; }
    .order p { color: #ccc; line-height: 1.8; margin: 6px 0; }
    .total {
      color: white !important;
      font-size: 20px;
      font-weight: bold;
      border-top: 1px solid #444;
      padding-top: 12px;
    }
    .status { color: #ddd; margin: 10px 0; }
    select {
      width: 100%;
      background: #292929;
      color: white;
      border: 1px solid #555;
      margin-top: 10px;
    }
    .save {
      width: 100%;
      background: white;
      color: black;
      margin: 10px 0;
    }
    .save:disabled { opacity: .5; cursor: wait; }
    #message { color: #bbb; margin: 20px 0; }
    @media(max-width:500px) {
      body { padding: 12px; }
      header { align-items: stretch; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>BLACK LINE</h1>
      <p>ADMIN DASHBOARD</p>
    </div>
    <div>
      <button class="refresh" id="refresh">تحديث الطلبات</button>
      <button class="logout" id="logout">خروج</button>
    </div>
  </header>

  <section class="summary">
    إجمالي الطلبات المعروضة
    <strong id="count">0</strong>
  </section>

  <p id="message">جاري تحميل الطلبات...</p>
  <section id="orders"></section>

  <script>
    const ordersBox = document.getElementById("orders");
    const message = document.getElementById("message");

    const statusNames = {
      pending: "جديد",
      processing: "قيد التجهيز",
      shipped: "تم الشحن",
      delivered: "تم التسليم",
      cancelled: "ملغي"
    };

    function addText(parent, tag, value, className = "") {
      const element = document.createElement(tag);
      element.textContent = value ?? "";
      if (className) element.className = className;
      parent.appendChild(element);
      return element;
    }

    async function updateOrder(id, status, button) {
      button.disabled = true;
      button.textContent = "جاري الحفظ...";

      try {
        const response = await fetch("/api/admin/update-order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ id, status })
        });

        if (response.status === 401) {
          window.location.href = "/admin/";
          return;
        }

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "فشل تحديث الحالة");
        }

        message.textContent = "تم تحديث الطلب #" + id + " بنجاح";
        await loadOrders();

      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "حفظ الحالة";
      }
    }

    async function loadOrders() {
      message.textContent = "جاري تحميل الطلبات...";
      ordersBox.replaceChildren();

      try {
        const response = await fetch("/api/admin/orders", {
          credentials: "same-origin",
          cache: "no-store"
        });

        if (response.status === 401) {
          window.location.href = "/admin/";
          return;
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "تعذر تحميل الطلبات");
        }

        const orders = data.orders || [];
        document.getElementById("count").textContent = orders.length;

        if (!orders.length) {
          message.textContent = "لا توجد طلبات حتى الآن.";
          return;
        }

        message.textContent = "";

        orders.forEach(order => {
          const card = document.createElement("article");
          card.className = "order";

          addText(card, "h3", "طلب رقم #" + order.id);
          addText(card, "p", "العميل: " + order.customer_name);
          addText(card, "p", "الهاتف: " + order.phone);
          addText(card, "p", "العنوان: " + order.address);
          addText(card, "p", "المنتج: " + order.product_name);
          addText(card, "p", "المقاس: " + (order.size || "غير محدد"));
          addText(card, "p", "اللون: " + (order.color || "غير محدد"));
          addText(card, "p", "الكمية: " + order.quantity);
          addText(card, "p", "سعر القطعة: " + order.price + " جنيه");
          addText(card, "p", "الحالة الحالية: " +
            (statusNames[order.status] || order.status), "status");
          addText(card, "p", "التاريخ: " + order.created_at);
          addText(card, "p", "الإجمالي: " + order.total + " جنيه", "total");

          const select = document.createElement("select");
          select.setAttribute("aria-label", "حالة الطلب");

          Object.entries(statusNames).forEach(([value, label]) => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = label;
            option.selected = value === order.status;
            select.appendChild(option);
          });

          card.appendChild(select);

          const saveButton = document.createElement("button");
          saveButton.className = "save";
          saveButton.textContent = "حفظ الحالة";
          saveButton.addEventListener("click", () => {
            updateOrder(order.id, select.value, saveButton);
          });

          card.appendChild(saveButton);
          ordersBox.appendChild(card);
        });

      } catch (error) {
        message.textContent = error.message;
      }
    }

    document.getElementById("refresh").addEventListener("click", loadOrders);

    document.getElementById("logout").addEventListener("click", () => {
      window.location.href = "/api/admin/logout";
    });

    loadOrders();
  </script>
</body>
</html>
